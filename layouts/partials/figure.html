{{- /* Figure: image (or video) on a hairline accent rule, optional caption tab. Context: (dict "src" url "href" url "alt" text "caption" text "video" bool "autoplay" bool) */ -}}
<figure class="below"{{ if .caption }} tabindex="0"{{ end }}>
    <div class="fig-im">
        {{- if .video }}
        <video src="{{ .src }}" controls muted loop playsinline{{ if .autoplay }} autoplay{{ else }} preload="metadata"{{ end }} aria-label="{{ .alt }}"></video>
        {{- else }}
        <a target="_blank" rel="noopener" href="{{ .href }}"><img src="{{ .src }}" alt="{{ .alt }}" loading="lazy"></a>
        {{- end }}
    </div>
    {{- with .caption }}
    <figcaption><span class="txt">{{ . }}</span></figcaption>
    {{- end }}
</figure>
